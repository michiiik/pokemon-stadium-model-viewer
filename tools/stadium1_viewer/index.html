<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pokémon Stadium Model Viewer</title>
  <link rel="stylesheet" href="/viewer/style.css">
</head>
<body>
  <header class="topbar">
    <div>
      <div id="provider-label" class="eyebrow">STADIUM / RESOURCE INSPECTOR</div>
      <h1>Model &amp; animation viewer</h1>
    </div>
    <div id="health" class="health">Connecting…</div>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <nav id="provider-tabs" class="provider-tabs" aria-label="Game provider tabs" hidden></nav>
      <label class="search-label" for="search">Browse models and animations</label>
      <input id="search" class="search" type="search" placeholder="Search by file, ID, or name">
      <div class="sidebar-panels">
        <section class="side-section control-panel">
          <div class="panel-heading">
            <div class="section-title">Models</div>
            <div id="catalog-status" class="muted">Loading catalog…</div>
          </div>
          <div id="model-list" class="resource-list"></div>
        </section>
        <section class="side-section control-panel">
          <div class="panel-heading">
            <div class="section-title">Animations</div>
          </div>
          <div id="animation-list" class="animation-list muted">Select a model.</div>
        </section>
      </div>
    </aside>

    <section class="workspace">
      <div class="viewport-wrap">
        <canvas id="viewport" aria-label="3D model viewport"></canvas>
        <div id="viewport-empty" class="viewport-empty">
          <div class="empty-mark">◈</div>
          <strong>Select a model</strong>
          <span>Orbit with drag · zoom with wheel · presets 1 / 2 / 3</span>
        </div>
        <div id="bone-labels" class="bone-labels"></div>
      </div>

      <div class="toolbar">
        <button id="play" class="primary">Play</button>
        <button id="step-back">◀ Frame</button>
        <button id="step-forward">Frame ▶</button>
        <label class="inline-control">Speed <input id="speed" type="range" min="0.1" max="3" value="1" step="0.1"><output id="speed-value">1.0×</output></label>
        <label class="inline-control"><input id="loop" type="checkbox" checked> Loop</label>
        <label class="inline-control">Frame <input id="timeline" type="range" min="0" max="0" value="0" step="1"></label>
      </div>

      <div class="info-grid">
        <section class="info-card">
          <div class="section-title">Selection</div>
          <div id="selection-info" class="selection-info">No model selected.</div>
        </section>
        <section class="info-card toggles">
          <div class="section-title">View</div>
          <label><input id="toggle-textures" type="checkbox" checked> Textures</label>
          <label><input id="toggle-lighting" type="checkbox" checked> Lighting</label>
          <label><input id="toggle-wireframe" type="checkbox"> Wireframe</label>
          <label><input id="toggle-axes" type="checkbox" checked> Axes</label>
          <label><input id="toggle-bounds" type="checkbox"> Bounds</label>
          <label><input id="toggle-skeleton" type="checkbox"> Skeleton</label>
          <label><input id="toggle-bonenames" type="checkbox"> Bone names</label>
          <div class="preset-row">
            <button data-preset="front">Front</button><button data-preset="side">Side</button><button data-preset="top">Top</button><button id="reset-camera">Reset</button>
          </div>
        </section>
      </div>

      <section class="diagnostics-card">
        <div class="section-title">Resource report</div>
        <div id="diagnostics" class="diagnostics muted">No resource loaded.</div>
      </section>
    </section>
  </main>
  <script src="/viewer/bone_math.js"></script>
  <script src="/viewer/viewer.js"></script>
</body>
</html>
